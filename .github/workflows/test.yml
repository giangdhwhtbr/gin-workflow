name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML jsonschema
      - name: Stub claude CLI for the smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: python3 -m unittest tests/test_all.py -v
        env:
          PYTHONPATH: plugins/gin-workflow/src/scripts
      - run: python3 -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - if: ${{ !cancelled() }}
        run: bash tests/install_smoke_test.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML jsonschema
      - name: PyYAML for py -3, which the installed shim prefers
        run: py -3 -m pip install PyYAML
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Unit tests, with a temp dir that has no 8.3 short name
        run: python -m unittest tests/test_all.py -v
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONPATH: plugins/gin-workflow/src/scripts
      - if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File tests/install_smoke_test.ps1
