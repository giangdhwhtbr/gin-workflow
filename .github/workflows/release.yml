name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the gin-workflow version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugins/gin-workflow/plugin.meta.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugins/gin-workflow/plugin.meta.json version $version"; exit 1
          fi
      - name: Install test dependencies
        run: python3 -m pip install PyYAML jsonschema
      - name: Git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
