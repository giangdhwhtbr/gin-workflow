site_name: gin-workflow
site_url: https://giangdhwhtbr.github.io/gin-workflow/
site_description: A workflow plugin that takes a change from requirement to merge through recorded gates.
repo_url: https://github.com/giangdhwhtbr/gin-workflow
repo_name: giangdhwhtbr/gin-workflow
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
          nav_translations:
            Home: Trang chủ
            Getting started: Bắt đầu
            Team roles: Vai trò trong nhóm
            Starters: Khởi đầu
            Guides: Hướng dẫn
            Reference: Tham chiếu
            Greenfield: Dự án mới
            Brownfield: Dự án có sẵn
            Use cases: Tình huống sử dụng
            Team mode: Chế độ nhóm
            Using AI effectively: Dùng AI hiệu quả
            Working with Claude Code: Làm việc với Claude Code
            SDD living specs: Living specs (SDD)
            QA add-on: Tiện ích QA
            Customizing templates: Tùy chỉnh template
            Rule packs: Bộ quy tắc
            AI usage report: Báo cáo sử dụng AI
            Recommended tools: Công cụ khuyên dùng
            Windows: Windows
            Skills: Skill
            CLI: CLI
            Configuration: Cấu hình
            Troubleshooting: Xử lý sự cố

not_in_nav: |
  /concepts/**
  /orchestrator/**
  /contributing.md
  /reference/orchestrator-contract.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Team roles: roles.md
  - Starters:
      - Greenfield: starters/greenfield.md
      - Brownfield: starters/brownfield.md
  - Guides:
      - Use cases: guides/use-cases.md
      - Team mode: guides/team.md
      - Using AI effectively: guides/ai-strategy.md
      - Working with Claude Code: guides/claude-workflow.md
      - SDD living specs: guides/sdd.md
      - QA add-on: guides/qa.md
      - Customizing templates: guides/customizing-templates.md
      - Rule packs: guides/rules.md
      - AI usage report: guides/usage-report.md
      - Recommended tools: guides/recommended-tools.md
      - Windows: guides/windows.md
  - Reference:
      - Skills: reference/skills.md
      - CLI: reference/cli.md
      - Configuration: reference/config.md
      - Troubleshooting: reference/troubleshooting.md
