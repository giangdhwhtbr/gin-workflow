<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bead Graph & Details</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #1e293b;
  background-color: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
.header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-title h1 {
  font-size: 1.1rem;
  font-weight: 600;
  color: #0f172a;
}
.meta-tag {
  font-size: 0.8rem;
  color: #64748b;
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 4px;
}
.legend {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.8rem;
  color: #475569;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}
button.btn {
  background: #0284c7;
  color: #ffffff;
  border: none;
  border-radius: 4px;
  padding: 6px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 500;
}
button.btn:hover {
  background: #0369a1;
}
main {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(340px, 2fr);
  flex: 1;
  overflow: hidden;
}
#graph-container {
  overflow: auto;
  background: #f8fafc;
  position: relative;
  border-right: 1px solid #e2e8f0;
}
svg#graph {
  display: block;
}
.node-card {
  cursor: pointer;
}
.node-card rect {
  rx: 6;
  ry: 6;
  stroke: #cbd5e1;
  stroke-width: 1.5;
  transition: stroke 0.15s, stroke-width 0.15s;
}
.node-card.selected rect {
  stroke: #0284c7 !important;
  stroke-width: 3 !important;
}
.node-card.role-root rect {
  stroke: #0f172a;
  stroke-width: 2.5;
}
.node-card.role-bug rect {
  stroke: #ef4444;
  stroke-dasharray: 4 2;
}
.node-card text.node-id {
  font-size: 11px;
  font-weight: 700;
  fill: #0f172a;
}
.node-card text.node-title {
  font-size: 11px;
  fill: #334155;
}
.edge-parent {
  stroke: #94a3b8;
  stroke-width: 1.5;
  fill: none;
}
.edge-blocks {
  stroke: #f97316;
  stroke-width: 2;
  stroke-dasharray: none;
  fill: none;
  marker-end: url(#arrow-blocks);
}
.edge-discovered {
  stroke: #ef4444;
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
  fill: none;
}
#detail-pane {
  background: #ffffff;
  overflow-y: auto;
  padding: 20px;
}
.detail-header {
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 12px;
  margin-bottom: 16px;
}
.detail-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.detail-id {
  font-size: 1.1rem;
  font-weight: 700;
  color: #0f172a;
}
.detail-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 10px;
}
.badge-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.badge {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  text-transform: uppercase;
}
.badge-status-open { background: #dbeafe; color: #1e40af; }
.badge-status-in_progress { background: #fef3c7; color: #92400e; }
.badge-status-blocked { background: #fee2e2; color: #991b1b; }
.badge-status-closed { background: #dcfce7; color: #166534; }
.badge-status-deferred { background: #f1f5f9; color: #475569; }
.section {
  margin-bottom: 20px;
}
.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #475569;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
pre.text {
  font-family: inherit;
  font-size: 0.9rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  background: #f8fafc;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #e2e8f0;
  color: #334155;
}
.table-props {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.table-props td {
  padding: 6px 8px;
  border-bottom: 1px solid #f1f5f9;
}
.table-props td:first-child {
  font-weight: 600;
  color: #64748b;
  width: 30%;
}
.comment-item {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.comment-meta {
  font-size: 0.75rem;
  color: #64748b;
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}
.comment-author {
  font-weight: 600;
  color: #0f172a;
}
.comment-text {
  font-size: 0.85rem;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}
.id-link {
  color: #0284c7;
  cursor: pointer;
  text-decoration: underline;
  background: none;
  border: none;
  font: inherit;
  padding: 0;
}
.id-link:hover {
  color: #0369a1;
}
.node-link-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  padding: 4px 0;
}
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1 id="top-title">Bead Graph</h1>
    <span class="meta-tag" id="meta-info"></span>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div><span>Open</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div><span>In Progress</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444;"></div><span>Blocked</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e;"></div><span>Closed</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#a3a3a3;"></div><span>Deferred</span></div>
  </div>
  <button id="btn-back-root" class="btn">Back to root</button>
</header>
<main>
  <div id="graph-container">
    <svg id="graph">
      <defs>
        <marker id="arrow-blocks" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
        </marker>
      </defs>
      <g id="edges-layer"></g>
      <g id="nodes-layer"></g>
    </svg>
  </div>
  <aside id="detail-pane"></aside>
</main>
<script>
const DATA = /*__DESCRIBE_DATA__*/;

(function() {
  const rootId = DATA.meta.root;
  document.getElementById("top-title").textContent = "Bead: " + rootId;
  document.getElementById("meta-info").textContent = "Repo: " + DATA.meta.repo + " | Generated: " + DATA.meta.generated_at;

  const nodeMap = new Map();
  DATA.nodes.forEach(n => nodeMap.set(n.id, n));

  let selectedId = rootId;

  const statusColors = {
    open: "#eff6ff",
    in_progress: "#fefce8",
    blocked: "#fef2f2",
    closed: "#f0fdf4",
    deferred: "#f8fafc"
  };
  const statusBorderColors = {
    open: "#3b82f6",
    in_progress: "#f59e0b",
    blocked: "#ef4444",
    closed: "#22c55e",
    deferred: "#a3a3a3"
  };

  const CARD_W = 180;
  const CARD_H = 56;
  const GAP_X = 220;
  const GAP_Y = 110;

  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  if (DATA.nodes.length > 0) {
    minX = Math.min(...DATA.nodes.map(n => n.x || 0));
    maxX = Math.max(...DATA.nodes.map(n => n.x || 0));
    minY = Math.min(...DATA.nodes.map(n => n.y || 0));
    maxY = Math.max(...DATA.nodes.map(n => n.y || 0));
  }

  const padLeft = 40;
  const padTop = 40;

  function toPx(x, y) {
    return {
      px: (x - minX) * GAP_X + padLeft,
      py: (y - minY) * GAP_Y + padTop
    };
  }

  const svg = document.getElementById("graph");
  const totalW = Math.max(800, (maxX - minX) * GAP_X + CARD_W + padLeft * 2);
  const totalH = Math.max(600, (maxY - minY) * GAP_Y + CARD_H + padTop * 2);
  svg.setAttribute("width", totalW);
  svg.setAttribute("height", totalH);

  const edgesLayer = document.getElementById("edges-layer");
  const nodesLayer = document.getElementById("nodes-layer");

  // Render edges
  DATA.edges.forEach(e => {
    const fromNode = nodeMap.get(e.from);
    const toNode = nodeMap.get(e.to);
    if (!fromNode || !toNode) return;

    const pFrom = toPx(fromNode.x || 0, fromNode.y || 0);
    const pTo = toPx(toNode.x || 0, toNode.y || 0);

    const x1 = pFrom.px + CARD_W / 2;
    const y1 = pFrom.py + CARD_H;
    const x2 = pTo.px + CARD_W / 2;
    const y2 = pTo.py;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    if (e.kind === "blocks") {
      path.setAttribute("class", "edge-blocks");
      const dx = x2 - x1;
      const dy = y2 - y1;
      const cx1 = x1 + dx * 0.2 + (y2 < y1 ? 40 : 20);
      const cy1 = y1 + dy * 0.5;
      const cx2 = x2 - dx * 0.2 + (y2 < y1 ? 40 : 20);
      const cy2 = y2 - dy * 0.5;
      path.setAttribute("d", `M ${x1} ${y1 - CARD_H/2} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`);
    } else if (e.kind === "discovered") {
      path.setAttribute("class", "edge-discovered");
      path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`);
    } else {
      path.setAttribute("class", "edge-parent");
      path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`);
    }
    edgesLayer.appendChild(path);
  });

  // Render nodes
  DATA.nodes.forEach(n => {
    const p = toPx(n.x || 0, n.y || 0);

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", `node-card role-${n.role} ${n.id === selectedId ? "selected" : ""}`);
    g.setAttribute("id", "node-" + n.id);
    g.setAttribute("transform", `translate(${p.px}, ${p.py})`);

    const titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
    titleEl.textContent = `${n.id}: ${n.title} (${n.status || ""})`;
    g.appendChild(titleEl);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("width", CARD_W);
    rect.setAttribute("height", CARD_H);
    rect.setAttribute("fill", statusColors[n.status] || "#ffffff");
    rect.setAttribute("stroke", statusBorderColors[n.status] || "#cbd5e1");
    g.appendChild(rect);

    const textId = document.createElementNS("http://www.w3.org/2000/svg", "text");
    textId.setAttribute("class", "node-id");
    textId.setAttribute("x", 10);
    textId.setAttribute("y", 20);
    textId.textContent = n.id;
    g.appendChild(textId);

    const textTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
    textTitle.setAttribute("class", "node-title");
    textTitle.setAttribute("x", 10);
    textTitle.setAttribute("y", 38);
    const shortTitle = n.title && n.title.length > 24 ? n.title.slice(0, 23) + "…" : (n.title || "");
    textTitle.textContent = shortTitle;
    g.appendChild(textTitle);

    g.addEventListener("click", () => {
      selectNode(n.id);
    });

    nodesLayer.appendChild(g);
  });

  function selectNode(id) {
    if (!nodeMap.has(id)) return;
    selectedId = id;

    document.querySelectorAll(".node-card").forEach(el => el.classList.remove("selected"));
    const selEl = document.getElementById("node-" + id);
    if (selEl) selEl.classList.add("selected");

    renderDetail(nodeMap.get(id));
  }

  function renderDetail(node) {
    const pane = document.getElementById("detail-pane");
    pane.replaceChildren();

    // Detail header
    const header = document.createElement("div");
    header.className = "detail-header";

    const top = document.createElement("div");
    top.className = "detail-header-top";

    const idSpan = document.createElement("span");
    idSpan.className = "detail-id";
    idSpan.textContent = node.id;
    top.appendChild(idSpan);

    const badgeGroup = document.createElement("div");
    badgeGroup.className = "badge-group";

    if (node.status) {
      const bStatus = document.createElement("span");
      bStatus.className = `badge badge-status-${node.status}`;
      bStatus.textContent = node.status;
      badgeGroup.appendChild(bStatus);
    }
    if (node.type) {
      const bType = document.createElement("span");
      bType.className = "badge";
      bType.style.background = "#f1f5f9";
      bType.style.color = "#475569";
      bType.textContent = node.type;
      badgeGroup.appendChild(bType);
    }
    if (node.role) {
      const bRole = document.createElement("span");
      bRole.className = "badge";
      bRole.style.background = "#e2e8f0";
      bRole.style.color = "#334155";
      bRole.textContent = node.role;
      badgeGroup.appendChild(bRole);
    }
    top.appendChild(badgeGroup);
    header.appendChild(top);

    const titleH = document.createElement("h2");
    titleH.className = "detail-title";
    titleH.textContent = node.title || "(no title)";
    header.appendChild(titleH);

    pane.appendChild(header);

    const d = node.detail || {};

    // Standard pre-formatted text fields
    const textSections = [
      ["Description", d.description],
      ["Design", d.design],
      ["Acceptance Criteria", d.acceptance_criteria],
      ["Notes", d.notes],
      ["Close Reason", d.close_reason]
    ];

    textSections.forEach(([heading, val]) => {
      if (val) {
        const sec = document.createElement("div");
        sec.className = "section";
        const h = document.createElement("div");
        h.className = "section-title";
        h.textContent = heading;
        sec.appendChild(h);

        const pre = document.createElement("pre");
        pre.className = "text";
        pre.textContent = val;
        sec.appendChild(pre);
        pane.appendChild(sec);
      }
    });

    // Metadata & properties table
    const propRows = [];
    if (node.priority !== undefined) propRows.push(["Priority", "P" + node.priority]);
    if (d.assignee) propRows.push(["Assignee", d.assignee]);
    if (d.owner) propRows.push(["Owner", d.owner]);
    if (d.labels && d.labels.length) propRows.push(["Labels", d.labels.join(", ")]);
    if (d.created_at) propRows.push(["Created At", d.created_at]);
    if (d.updated_at) propRows.push(["Updated At", d.updated_at]);
    if (d.closed_at) propRows.push(["Closed At", d.closed_at]);

    if (propRows.length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Properties";
      sec.appendChild(h);

      const table = document.createElement("table");
      table.className = "table-props";
      propRows.forEach(([k, v]) => {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        td1.textContent = k;
        const td2 = document.createElement("td");
        td2.textContent = v;
        tr.appendChild(td1);
        tr.appendChild(td2);
        table.appendChild(tr);
      });
      sec.appendChild(table);
      pane.appendChild(sec);
    }

    // Extended Metadata dict
    if (d.metadata && Object.keys(d.metadata).length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Metadata";
      sec.appendChild(h);

      const pre = document.createElement("pre");
      pre.className = "text";
      pre.textContent = JSON.stringify(d.metadata, null, 2);
      sec.appendChild(pre);
      pane.appendChild(sec);
    }

    // Relations (Children, Blocked by, Discovered Bugs)
    const childEdges = DATA.edges.filter(e => e.kind === "parent" && e.from === node.id);
    const blockerEdges = DATA.edges.filter(e => e.kind === "blocks" && e.to === node.id);
    const bugEdges = DATA.edges.filter(e => e.kind === "discovered" && e.from === node.id);
    const extBlockers = d.external_blockers || [];

    if (childEdges.length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Children (" + childEdges.length + ")";
      sec.appendChild(h);

      childEdges.forEach(e => {
        const target = nodeMap.get(e.to);
        const item = document.createElement("div");
        item.className = "node-link-item";

        const btn = document.createElement("button");
        btn.className = "id-link";
        btn.textContent = e.to;
        btn.addEventListener("click", () => selectNode(e.to));
        item.appendChild(btn);

        if (target) {
          const titleSpan = document.createElement("span");
          titleSpan.textContent = "– " + target.title;
          item.appendChild(titleSpan);
        }
        sec.appendChild(item);
      });
      pane.appendChild(sec);
    }

    if (blockerEdges.length > 0 || extBlockers.length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Blocked By";
      sec.appendChild(h);

      blockerEdges.forEach(e => {
        const source = nodeMap.get(e.from);
        const item = document.createElement("div");
        item.className = "node-link-item";

        const btn = document.createElement("button");
        btn.className = "id-link";
        btn.textContent = e.from;
        btn.addEventListener("click", () => selectNode(e.from));
        item.appendChild(btn);

        if (source) {
          const titleSpan = document.createElement("span");
          titleSpan.textContent = "– " + source.title;
          item.appendChild(titleSpan);
        }
        sec.appendChild(item);
      });

      extBlockers.forEach(b => {
        const item = document.createElement("div");
        item.className = "node-link-item";
        item.style.color = "#64748b";

        const idSpan = document.createElement("span");
        idSpan.style.fontWeight = "600";
        idSpan.textContent = b.id + " (external)";
        item.appendChild(idSpan);

        const titleSpan = document.createElement("span");
        titleSpan.textContent = "– " + b.title + (b.status ? " [" + b.status + "]" : "");
        item.appendChild(titleSpan);
        sec.appendChild(item);
      });
      pane.appendChild(sec);
    }

    if (bugEdges.length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Linked Bugs (" + bugEdges.length + ")";
      sec.appendChild(h);

      bugEdges.forEach(e => {
        const bugNode = nodeMap.get(e.to);
        const item = document.createElement("div");
        item.className = "node-link-item";

        const btn = document.createElement("button");
        btn.className = "id-link";
        btn.textContent = e.to;
        btn.addEventListener("click", () => selectNode(e.to));
        item.appendChild(btn);

        if (bugNode) {
          const titleSpan = document.createElement("span");
          titleSpan.textContent = "– " + bugNode.title;
          item.appendChild(titleSpan);
        }
        sec.appendChild(item);
      });
      pane.appendChild(sec);
    }

    // Comments section
    if (d.comments && d.comments.length > 0) {
      const sec = document.createElement("div");
      sec.className = "section";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = "Comments (" + d.comments.length + ")";
      sec.appendChild(h);

      d.comments.forEach(c => {
        const cItem = document.createElement("div");
        cItem.className = "comment-item";

        const cMeta = document.createElement("div");
        cMeta.className = "comment-meta";

        const cAuthor = document.createElement("span");
        cAuthor.className = "comment-author";
        cAuthor.textContent = c.author || "Unknown";
        cMeta.appendChild(cAuthor);

        if (c.created_at) {
          const cDate = document.createElement("span");
          cDate.textContent = c.created_at;
          cMeta.appendChild(cDate);
        }
        cItem.appendChild(cMeta);

        const cText = document.createElement("div");
        cText.className = "comment-text";
        cText.textContent = c.text || "";
        cItem.appendChild(cText);

        sec.appendChild(cItem);
      });
      pane.appendChild(sec);
    }
  }

  document.getElementById("btn-back-root").addEventListener("click", () => {
    selectNode(rootId);
  });

  // Initial display
  selectNode(rootId);
})();
</script>
</body>
</html>
