# generated by gin-workflow team init; remove this line to keep local edits
name: gin-workflow
on:
  pull_request:
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages
        if: ${{ '{{convention}}' != 'none' }}
        run: |
          bad=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in "fixup! "*|"squash! "*|"Revert \""*) continue ;; esac
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
              echo "::error::$sha: $subject"; bad=1
            fi
          done
          exit $bad
      - name: Specs and CODEOWNERS
        if: ${{ hashFiles('.agent-workflow/config.yaml') != '' && vars.GIN_WORKFLOW_INSTALL != '' }}
        run: |
          eval "$GIN_WORKFLOW_INSTALL"
          gin-workflow team codeowners --check
          if grep -q 'layout: sdd' .agent-workflow/config.yaml; then gin-workflow specs lint; fi
        env:
          GIN_WORKFLOW_INSTALL: ${{ vars.GIN_WORKFLOW_INSTALL }}
