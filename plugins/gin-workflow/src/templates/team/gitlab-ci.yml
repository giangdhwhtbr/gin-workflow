# generated by gin-workflow team init; remove this line to keep local edits
# Add to .gitlab-ci.yml:  include: { local: .gitlab/ci/gin-workflow.yml }
gin-workflow-conventions:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    CONVENTION: "{{convention}}"
  script:
    - |
      bad=0
      if [ "$CONVENTION" != "none" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        for sha in $(git rev-list --no-merges "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"); do
          subject=$(git log -1 --format=%s "$sha")
          case "$subject" in "fixup! "*|"squash! "*|"Revert \""*) continue ;; esac
          if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
            echo "$sha: $subject"; bad=1
          fi
        done
      fi
      if [ -n "$GIN_WORKFLOW_INSTALL" ]; then
        eval "$GIN_WORKFLOW_INSTALL"
        gin-workflow team codeowners --check || bad=1
        if grep -q 'layout: sdd' .agent-workflow/config.yaml; then gin-workflow specs lint || bad=1; fi
      fi
      exit $bad
