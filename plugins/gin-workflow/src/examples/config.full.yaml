schema_version: "2.7"
workflow_version: "2.7"
setup_cli_version: "2.7"
harness: codex
provider_mode: multi

project:
  stage: brownfield
  shape: fullstack
  monorepo: false
  rigor: standard
  worktree: parallel
  review: independent
  review_ledger: false

verify:
  checks:
    lint: pnpm run lint
    typecheck: pnpm exec tsc --noEmit
    test: pnpm run test
    build: pnpm run build
    e2e: ""

quick:
  max_files: 5

artifacts:
  plans: .planning/plans
  beads: .beads
  worktrees: .planning/worktrees
  knowledge: .planning/knowledge
  evidence: .agent-workflow/runtime/evidence
  runtime: .agent-workflow/runtime
  layout: sdd
  specs: docs/specs
  changes: docs/changes
  adr: docs/adr
  codebase: docs/codebase
  spec_review: chat

routing:
  roles:
    backend:
      preferred: [claude]
      fallback: [main_harness]
    frontend:
      preferred: [antigravity]
      fallback: [claude, main_harness]
    review:
      preferred: [main_harness]
      fallback: [claude]
      require_independent: true
    docs:
      preferred: [antigravity]
      fallback: [main_harness]
    general:
      preferred: [main_harness]
      fallback: [claude, antigravity]
  concurrency:
    claude: 2
    antigravity: 2
    codex: 1
    opencode: 1
  queue:
    max_wait_seconds: 600
  worker:
    timeout_seconds: 900
    max_retries: 2
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 900
    half_open_max_probes: 1
  review:
    role: review
    require_independent: true
    allow_self_review_fallback: false
    max_cycles: 2
    independence: provider

policy:
  approval:
    ttl_seconds: 86400
    bind_to_scope: true
rules:
  packs: [core, typescript, react]
  disabled: []
team:
  host: github
  commit_convention: conventional
  members:
    an@example.com: {roles: [ba], login: an-ba}
    binh@example.com: {roles: [be_lead, be_dev], login: binh-dev}
    chi@example.com: {roles: [fe_lead, fe_dev], login: chi-fe}
    dung@example.com: {roles: [qe], login: dung-qe}
  areas:
    backend: {paths: ["services/**"], lead: be_lead, roles: [be_dev]}
    frontend: {paths: ["web/**"], lead: fe_lead, roles: [fe_dev]}
  approvals:
    requirement_confirmed: [ba, be_lead, fe_lead]
    plan_approved: area_lead
    verification_passed: [qe]
qa:
  cases: qa/cases
  guidelines: qa/guidelines.md
  e2e: qa/e2e
