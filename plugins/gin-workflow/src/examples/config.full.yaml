schema_version: "2.4"
workflow_version: "2.4"
setup_cli_version: "2.4"
harness: codex
provider_mode: multi

project:
  stage: brownfield
  shape: fullstack
  monorepo: false
  rigor: standard
  worktree: parallel
  review: independent
  review_ledger: false

verify:
  checks:
    lint: pnpm run lint
    typecheck: pnpm exec tsc --noEmit
    test: pnpm run test
    build: pnpm run build
    e2e: ""

quick:
  max_files: 5

artifacts:
  plans: .planning/plans
  beads: .beads
  worktrees: .planning/worktrees
  knowledge: .planning/knowledge
  evidence: .agent-workflow/runtime/evidence
  runtime: .agent-workflow/runtime

routing:
  roles:
    backend:
      preferred: [claude]
      fallback: [main_harness]
    frontend:
      preferred: [antigravity]
      fallback: [claude, main_harness]
    review:
      preferred: [main_harness]
      fallback: [claude]
      require_independent: true
    docs:
      preferred: [antigravity]
      fallback: [main_harness]
    general:
      preferred: [main_harness]
      fallback: [claude, antigravity]
  concurrency:
    claude: 2
    antigravity: 2
    codex: 1
  queue:
    max_wait_seconds: 600
  worker:
    timeout_seconds: 900
    max_retries: 2
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 900
    half_open_max_probes: 1
  review:
    role: review
    require_independent: true
    allow_self_review_fallback: false
    max_cycles: 2
    independence: provider

policy:
  approval:
    ttl_seconds: 86400
    bind_to_scope: true

