harness: claude
provider_mode: multi
routing:
  circuit_breaker:
    cooldown_seconds: 900
    failure_threshold: 3
    half_open_max_probes: 1
  concurrency:
    antigravity: 2
    claude: 2
    codex: 1
    opencode: 2
  queue:
    max_wait_seconds: 600
  review:
    allow_self_review_fallback: false
    independence: session
    max_cycles: 3
    require_independent: true
    role: review
  roles:
    backend:
      by_tier:
        high:
        - antigravity
        low:
        - opencode
        medium:
        - opencode
      fallback:
      - main_harness
      preferred:
      - main_harness
    docs:
      preferred:
      - main_harness
    frontend:
      by_tier:
        high:
        - antigravity
        low:
        - opencode
        medium:
        - opencode
      fallback:
      - main_harness
      preferred:
      - main_harness
    general:
      by_tier:
        high:
        - antigravity
        low:
        - opencode
        medium:
        - opencode
      fallback:
      - main_harness
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
  worker:
    max_retries: 2
    timeout_seconds: 900
schema_version: '2.3'
setup_cli_version: '2.3'
workflow_version: '2.3'
