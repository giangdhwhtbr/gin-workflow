harness: claude
models:
  antigravity:
    models:
    - gemini-3.8-flash-low
    - gemini-3.8-flash-medium
    - gemini-3.8-flash-high
  codex:
    models:
    - gpt-6-luna
    - gpt-6.1-sol
    - gpt-6-astra
  opencode:
    models:
    - opencode-go/deepseek-v4.1-flash#high
providers:
  task_tracking: beads
routing:
  review:
    allow_self_review_fallback: false
    max_cycles: 3
    require_independent: true
    role: review
  roles:
    backend:
      preferred:
      - main_harness
    docs:
      preferred:
      - main_harness
    frontend:
      preferred:
      - main_harness
    general:
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
schema_version: '2.11'
setup_cli_version: '2.11'
verify:
  checks:
    test: python3 -m pytest -n auto
  no_test_paths:
  - .planning/plans
  - .planning/knowledge
  - .planning/reviews
  - .planning/roadmap.md
workflow_version: '2.11'
