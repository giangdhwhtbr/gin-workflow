harness: claude
orchestrator:
  circuit_breaker:
    cooldown_seconds: 900
    failure_threshold: 3
    half_open_max_probes: 1
  concurrency:
    antigravity: 2
    claude: 2
    codex: 1
    opencode: 2
  queue:
    max_wait_seconds: 600
  roles:
    backend:
      by_tier:
        high:
        - antigravity
        low:
        - antigravity
        medium:
        - antigravity
      fallback:
      - main_harness
      preferred:
      - main_harness
    frontend:
      by_tier:
        high:
        - antigravity
        low:
        - antigravity
        medium:
        - antigravity
      fallback:
      - main_harness
      preferred:
      - main_harness
    general:
      by_tier:
        high:
        - antigravity
        low:
        - antigravity
        medium:
        - antigravity
      fallback:
      - main_harness
      preferred:
      - main_harness
  worker:
    max_retries: 2
    timeout_seconds: 900
provider_mode: multi
providers:
  task_tracking: beads
routing:
  review:
    allow_self_review_fallback: false
    independence: session
    max_cycles: 3
    require_independent: true
    role: review
  roles:
    backend:
      preferred:
      - main_harness
    docs:
      preferred:
      - main_harness
    frontend:
      preferred:
      - main_harness
    general:
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
schema_version: '2.8'
setup_cli_version: '2.8'
verify:
  checks:
    test: PYTHONPATH=plugins/gin-workflow/src/scripts python3 -m unittest tests.test_all
workflow_version: '2.8'
